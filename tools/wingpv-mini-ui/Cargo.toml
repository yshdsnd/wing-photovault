[package]
name = "wingpv-mini-ui"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/yshdsnd/wing-photovault"
authors = ["Yoshihide Sonoda"]
description = "Lightweight egui config editor and test runner UI for WING PhotoVault CLI (wingpv)"

[[bin]]
name = "wingpv-mini-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
toml = "0.8"
wing-photovault-core = { path = "../../crates/wing-photovault-core" }
