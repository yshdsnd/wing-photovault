# WING PhotoVault 設定サンプル
# コピーして wing-photovault.toml として編集してください。

[host]
# マルチホスト識別用の固定ID（空の場合はホスト名ベースで自動設定）
id = "main-pc"
name = "Main Windows PC"

[general]
db_path = "./wing-photovault.db"
log_dir = "./logs"
# 最優先: JPEG, Canon RAW (CR3, CR2, CRW), 任意: HEIF
image_exts = [".jpg", ".jpeg", ".cr3", ".cr2", ".crw", ".hif", ".heif", ".heic"]
video_exts = [".mp4", ".mov", ".m4v", ".avi"]
sidecar_exts = [".xmp", ".thm"]

[scan]
incremental = true
follow_symlinks = false

[hash]
# "blake3" (高速・推奨) または "sha256"
algorithm = "blake3"
partial_hash_enabled = true

[performance]
ssd_io_workers = 4
hdd_io_workers = 1
nas_io_workers = 2
cpu_workers = 0
db_batch_size = 1000

[exif]
# "auto" (ネイティブ優先 + ExifToolフォールバック) | "native" | "exiftool" | "none"
backend = "auto"
exiftool_path = ""
persistent_exiftool = true

[exif.lens_aliases]
# 旧型機種(EOS 10D/20D等)で焦点距離レンジのみ記録されるレンズの正規化例:
# "Unknown 100-400mm" = "EF100-400mm f/4.5-5.6L IS USM"
# "Unknown 28-75mm" = "SP AF28-75mm F/2.8 XR Di"
# "Unknown 17-85mm" = "EF-S17-85mm f/4-5.6 IS USM"
# "Canon RF200-800mm F6.3-9 IS USM" = "RF200-800mm F6.3-9 IS USM"

[stats]
# `wingpv stats --cost-per-shot` で1ショットあたり単価を算出するための任意設定
currency = "JPY"

[stats.camera_prices]
# "Canon EOS R5m2" = 600000
# "Canon EOS 7D Mark II" = 200000

[stats.lens_prices]
# "RF100-500mm F4.5-7.1 L IS USM" = 360000
# "EF100-400mm f/4.5-5.6L IS II USM" = 250000

[stats.camera_crop_factors]
# 35mm換算焦点距離 (`wingpv stats --focal-dist` / `--focal-35mm`) の任意上書き
# 未設定のカメラは EXIF FocalLengthIn35mmFilm または内蔵センサー係数 (Canon APS-C 1.6x 等) を自動使用
# "Canon EOS R7" = 1.6
# "DiMAGE X" = 6.49

# 複数ストレージ定義（同一階層に複数ドライブ登録可能、UNCパス対応）
# access_mode: "managed" | "read_only"
# backup_mode: "none" | "managed" | "external"
# failure_domain: 同一物理ディスク・同一筐体の識別子
# volume_id: 任意。外付け USB HDD 等のルートに `.wing-volume-id` を置いた場合の本人確認用（不一致時は Fail Closed）
[[storages]]
id = "hdd_archive_f"
root = 'F:\Photos'
media = "hdd"
tier = "archive"
access_mode = "managed"
backup_mode = "none"
failure_domain = "pc-hdd-f"
exclude_paths = []

[[storages]]
id = "ssd_hot_g"
root = 'G:\Photos'
media = "nvme"
tier = "hot"
access_mode = "managed"
backup_mode = "none"
failure_domain = "pc-nvme-g"
exclude_paths = []

[[storages]]
id = "ssd_hot_i"
root = 'I:\Photos'
media = "nvme"
tier = "hot"
access_mode = "managed"
backup_mode = "none"
failure_domain = "pc-nvme-i"
exclude_paths = []

[[storages]]
id = "ssd_hot_j"
root = 'J:\Photos'
media = "nvme"
tier = "hot"
access_mode = "managed"
backup_mode = "none"
failure_domain = "pc-nvme-j"
exclude_paths = []

[[storages]]
id = "nas_backup_eagle"
root = '\\eagle\photos'
media = "nas"
tier = "backup"
access_mode = "read_only"
backup_mode = "external"
failure_domain = "nas-eagle"
exclude_paths = []
